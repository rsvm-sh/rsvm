name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The suite has a zsh NOMATCH case; Ubuntu images do not ship zsh.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Environment
        run: |
          uname -a
          bash --version | head -n 1
          command -v zsh && zsh --version || echo "zsh not found"

      - name: Test
        run: bash test/test_suite.sh

  release:
    name: GitHub Release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "rsvm $GITHUB_REF_NAME" \
            --notes "$(cat <<EOF
          nvm-style Rust version manager.

          Install:

          \`\`\`bash
          curl -o- https://raw.githubusercontent.com/rsvm-sh/rsvm/${GITHUB_REF_NAME}/install_sh.sh | bash
          \`\`\`

          Then \`source ~/.zshrc\` (or \`~/.bashrc\`) and run \`rsvm help\`.
          EOF
          )"
